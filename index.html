<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cora Test Page</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #17212b;
      --muted: #5b6673;
      --accent: #2f7d6d;
      --line: rgba(23, 33, 43, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(47, 125, 109, 0.14), transparent 30%),
        linear-gradient(135deg, #f7f5ef 0%, #eaf1ee 52%, #f4eadc 100%);
      color: var(--ink);
    }

    main {
      width: min(760px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 24px 60px rgba(23, 33, 43, 0.14);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      max-width: 12ch;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.94;
      letter-spacing: 0;
    }

    p {
      margin: 24px 0 0;
      max-width: 58ch;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.65;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 34px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .meta span {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.48);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #edf2f2;
        --muted: #b5c1c5;
        --line: rgba(237, 242, 242, 0.18);
      }

      body {
        background:
          radial-gradient(circle at 16% 20%, rgba(80, 184, 158, 0.18), transparent 30%),
          linear-gradient(135deg, #101820 0%, #1b2b31 52%, #2a241e 100%);
      }

      main {
        background: rgba(15, 23, 31, 0.72);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
      }

      .meta span { background: rgba(255, 255, 255, 0.06); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub Pages smoke test</p>
    <h1>Hello from Cora.</h1>
    <p>This is a tiny static webpage published to GitHub for Dr. Yoon on June 28, 2026. If you can read this, the deployment path is working.</p>
    <div class="meta" aria-label="Deployment details">
      <span>Static HTML</span>
      <span>No build step</span>
      <span>Published on GitHub</span>
    </div>
  </main>
</body>
</html>
